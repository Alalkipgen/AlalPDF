name: Android CI

on:
  push:
    branches:
      - feat/alal-pdf-mvp
      - 'ci/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build-assemble.log
        shell: bash -o pipefail {0}
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build-test.log
        shell: bash -o pipefail {0}
      - name: Run lint
        run: ./gradlew lintDebug --stacktrace 2>&1 | tee build-lint.log
        shell: bash -o pipefail {0}
      - name: Upload APK and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alal-pdf-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            build-assemble.log
            build-test.log
            build-lint.log
          if-no-files-found: warn