name: Apply approved fixes
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-library-editor-pdf-links
      - name: Apply exact patch
        env:
          PATCH_GZ_B64: 
        run: |
          echo "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/fix.patch
          git apply /tmp/fix.patch
          rm .github/remaining-approved-fixes.patch .github/workflows/apply-approved-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: finish library and reader behavior"
          git push
