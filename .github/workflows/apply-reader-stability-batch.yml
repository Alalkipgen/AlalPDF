name: Apply reader stability batch

on:
  push:
    branches: [reader-stability-final]
    paths:
      - .github/workflows/apply-reader-stability-batch.yml
      - .github/batch/reader-fixes.patch.gz.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reader-stability-final
          fetch-depth: 0
      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/batch/reader-fixes.patch.gz.b64 | gzip --decompress > /tmp/reader-fixes.patch
          git apply --check /tmp/reader-fixes.patch
          git apply /tmp/reader-fixes.patch
          rm .github/batch/reader-fixes.patch.gz.b64
          rm .github/workflows/apply-reader-stability-batch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(reader): stabilize rendering rotation and library navigation"
          git push origin HEAD:reader-stability-final
