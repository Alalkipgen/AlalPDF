name: Android Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ASSET_BASE: pdf-reader-${{ github.ref_name }}
      REQUIRE_RELEASE_SIGNING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Validate permanent signing secrets
        env:
          ALALPDF_KEYSTORE_BASE64: ${{ secrets.ALALPDF_KEYSTORE_BASE64 }}
          ALALPDF_KEYSTORE_PASSWORD: ${{ secrets.ALALPDF_KEYSTORE_PASSWORD }}
          ALALPDF_KEY_ALIAS: ${{ secrets.ALALPDF_KEY_ALIAS }}
          ALALPDF_KEY_PASSWORD: ${{ secrets.ALALPDF_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ALALPDF_KEYSTORE_BASE64 ALALPDF_KEYSTORE_PASSWORD ALALPDF_KEY_ALIAS ALALPDF_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing $name secret"
              exit 1
            fi
          done
      - name: Decode release keystore
        env:
          ALALPDF_KEYSTORE_BASE64: ${{ secrets.ALALPDF_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ALALPDF_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alalpdf-release.keystore"
          echo "ALALPDF_KEYSTORE_PATH=$RUNNER_TEMP/alalpdf-release.keystore" >> "$GITHUB_ENV"
      - name: Report signing mode
        run: |
          echo "Signing status: permanent release key"
      - name: Run release unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace
        env:
          ALALPDF_KEYSTORE_PATH: ${{ env.ALALPDF_KEYSTORE_PATH }}
          ALALPDF_KEYSTORE_PASSWORD: ${{ secrets.ALALPDF_KEYSTORE_PASSWORD }}
          ALALPDF_KEY_ALIAS: ${{ secrets.ALALPDF_KEY_ALIAS }}
          ALALPDF_KEY_PASSWORD: ${{ secrets.ALALPDF_KEY_PASSWORD }}
      - name: Run release lint
        run: ./gradlew lintRelease --stacktrace
        env:
          ALALPDF_KEYSTORE_PATH: ${{ env.ALALPDF_KEYSTORE_PATH }}
          ALALPDF_KEYSTORE_PASSWORD: ${{ secrets.ALALPDF_KEYSTORE_PASSWORD }}
          ALALPDF_KEY_ALIAS: ${{ secrets.ALALPDF_KEY_ALIAS }}
          ALALPDF_KEY_PASSWORD: ${{ secrets.ALALPDF_KEY_PASSWORD }}
      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          ALALPDF_KEYSTORE_PATH: ${{ env.ALALPDF_KEYSTORE_PATH }}
          ALALPDF_KEYSTORE_PASSWORD: ${{ secrets.ALALPDF_KEYSTORE_PASSWORD }}
          ALALPDF_KEY_ALIAS: ${{ secrets.ALALPDF_KEY_ALIAS }}
          ALALPDF_KEY_PASSWORD: ${{ secrets.ALALPDF_KEY_PASSWORD }}
      - name: Prepare APK and checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$ASSET_BASE.apk"
          sha256sum "$ASSET_BASE.apk" > "$ASSET_BASE.apk.sha256"
      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            pdf-reader-${{ github.ref_name }}.apk
            pdf-reader-${{ github.ref_name }}.apk.sha256
      - name: Inspect release APK
        env:
          EXPECTED_CERT_SHA256: "1351e17ed8fe4b8b4e7e17a01a6769f13a1a1537366ba8295ad86b0e9d2390a9"
        run: |
          set -euo pipefail
          apk="$ASSET_BASE.apk"
          echo "APK size: $(stat -c '%s bytes' "$apk")"
          echo "APK SHA-256: $(sha256sum "$apk" | awk '{print $1}')"
          echo "APK zip integrity:"
          unzip -t "$apk" >/dev/null
          echo "OK"
          aapt2_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 -perm -111 | sort -V | tail -n 1)"
          if [ -z "$aapt2_path" ]; then
            echo "aapt2 was not found in the Android SDK" >&2
            exit 1
          fi
          echo "APK badging:"
          badging="$($aapt2_path dump badging "$apk")"
          printf '%s\n' "$badging" | grep -E "^package:|sdkVersion:"
          echo "Secret file scan:"
          if unzip -Z1 "$apk" | grep -Eiq '(^|/)([^/]*\.(jks|keystore)|local\.properties|[^/]*(password|secret)[^/]*)$'; then
            echo "Forbidden keystore or secret file found in APK" >&2
            exit 1
          fi
          echo "No .jks, .keystore, local.properties, password, or secret file found"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo "apksigner was not found in the Android SDK" >&2
            exit 1
          fi
          signature_output="$("$apksigner_path" verify --print-certs "$apk")"
          printf '%s\n' "$signature_output"
          actual_cert_sha256="$(printf '%s\n' "$signature_output" | awk -F': ' '/certificate SHA-256 digest:/ { print $NF; exit }' | tr '[:upper:]' '[:lower:]')"
          if [ "$actual_cert_sha256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Release APK was not signed by the permanent PDF Reader key" >&2
            exit 1
          fi
          echo "Permanent release signature verified"
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          prerelease: true
          files: |
            pdf-reader-${{ github.ref_name }}.apk
            pdf-reader-${{ github.ref_name }}.apk.sha256
          tag_name: ${{ github.ref_name }}
