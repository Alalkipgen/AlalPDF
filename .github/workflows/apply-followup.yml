name: Apply remaining Phase 1-5 integration
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply-followup:
    if: github.head_ref == 'features-phases-1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: features-phases-1-5
          fetch-depth: 0
      - run: |
          set -euxo pipefail
          base64 -d .github/followup.b64 | gzip -d > /tmp/followup.patch
          git apply --check /tmp/followup.patch
          git apply /tmp/followup.patch
          rm .github/followup.b64 .github/workflows/apply-followup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: finish editable PDF and reader integration'
          git push origin HEAD:features-phases-1-5
