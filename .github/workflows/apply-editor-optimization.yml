name: Apply editor optimization
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-text-editor-scroll
      - name: Apply source patch
        env:
          PATCH_GZ_B64: 
        run: |
          echo "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/editor.patch
          git apply /tmp/editor.patch
          rm .github/workflows/apply-editor-optimization.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(create): optimize rich text editing"
          git push
